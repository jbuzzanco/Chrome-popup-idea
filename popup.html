<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      min-height: 200px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .container {
      text-align: center;
    }
    
    h1 {
      margin: 0 0 20px 0;
      font-size: 24px;
      font-weight: 600;
    }
    
    .status {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    
    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
    }
    
    .keyword-tag {
      background: rgba(255, 255, 255, 0.3);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    
    .settings {
      margin-top: 20px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    
    button {
      background: rgba(255, 255, 255, 0.3);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    button:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    
    .no-keywords {
      opacity: 0.8;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Keyword Detector</h1>
    
    <div class="status" id="status">
      <div id="current-page">Checking current page...</div>
      <div class="keyword-list" id="keyword-list"></div>
    </div>
    
    <div class="settings">
      <input type="text" id="keyword-input" placeholder="Enter keywords (comma-separated)">
      <button id="save-keywords">Save Keywords</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
